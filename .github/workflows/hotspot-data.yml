name: 推送小程序数据到 COS

on:
  push:
    branches: [main]
    paths: ['index.html']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse report to data.json
        run: |
          cp index.html news-hotspot.html
          node tools/parse-html.js

      - name: Validate data.json
        run: |
          node -e "
          const d=require('./miniprogram/data/builtin.js');
          const n=Object.values(d.groups).reduce((s,g)=>s+g.length,0);
          if(!d.collectDate||n===0){console.error('data.json 校验失败');process.exit(1)}
          console.log('校验通过:', d.collectDate, n+'条');
          "

      - name: Upload data.json to COS
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          npm install cos-nodejs-sdk-v5 --no-save
          node tools/upload-cos.js

      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add miniprogram/data/data.json miniprogram/data/builtin.js
          git diff --cached --quiet || git commit -m "chore: update data.json [skip ci]"
          git push

